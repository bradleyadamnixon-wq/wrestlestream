name: Publish WrestleStream and refresh verified videos

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wrestlestream-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out WrestleStream
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the application
        run: |
          python -m unittest discover -s tests -v
          node --check app.js
          node --check sw.js
          node tests/smoke_ui.js
      - name: Refresh verified channels (scheduled or manual runs)
        if: github.event_name != 'push'
        id: refresh
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_catalogue.py
      - name: Save new video catalogue
        if: github.event_name != 'push' && steps.refresh.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official wrestling video catalogue"
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html app.js style.css sw.js manifest.webmanifest _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test published Android PWA
        env:
          WRESTLESTREAM_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ["WRESTLESTREAM_SITE_URL"].rstrip("/") + "/"
          checks = {
              "": "WrestleStream",
              "manifest.webmanifest": None,
              "app.js": None,
              "style.css": None,
              "sw.js": None,
              "data/catalogue.json": None,
              "data/sources.json": None,
              "assets/icon-192.png": None,
          }
          for attempt in range(1, 11):
              try:
                  for path, expected in checks.items():
                      url = base + path
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "WrestleStream-PWA-Check/1.0", "Cache-Control": "no-cache"},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read()
                          if response.status != 200 or not body:
                              raise RuntimeError(f"{path}: invalid HTTP response")
                      if expected and expected not in body.decode("utf-8"):
                          raise RuntimeError(f"{path}: expected application text missing")
                      if path == "manifest.webmanifest":
                          manifest = json.loads(body)
                          if manifest.get("display") != "standalone" or not manifest.get("icons"):
                              raise RuntimeError("PWA manifest missing standalone display or icons")
                      if path == "data/catalogue.json":
                          if not isinstance(json.loads(body).get("videos"), list):
                              raise RuntimeError("Video catalogue missing videos list")
                      if path == "assets/icon-192.png" and not body.startswith(b"\x89PNG\r\n\x1a\n"):
                          raise RuntimeError("PWA icon is not a PNG")
                  print(f"PASS: WrestleStream live site and all {len(checks)} assets accessible at {base}")
                  break
              except Exception as exc:
                  print(f"Live-site check {attempt}/10: {exc}", flush=True)
                  if attempt == 10:
                      raise
                  time.sleep(8)
          PY
